<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="AquaDevine pool cleaning and maintenance task management.">

    <title>AquaDevine Pool Care Management</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="index.js" defer></script>
</head>

<body>

    <!--placeholder where the header.html is loaded-->
    <div id="header"></div>
    
    <!-- Main content of Home Page-->
    <main class="container">

        <!-- Welcome section with a link to task management and dark mode-->
        <section class="mb-4">
            <h2>Welcome to AquaDevine</h2>
            <p>Manage your pool cleaning and maintenance tasks here.</p>
            
            <!-- Link to Tasks page-->
            <a href="tasks.html">Manage Tasks</a>

            <!--Button that changes page to dark mode / while in dark mode text for button changes to light mode-->
            <button id="darkMode">Dark Mode</button>

        </section>

        <!-- Section that pulls weather info from an API-->
        <section class="my-4 text-center">
            <h2>Current Weather</h2>

            <!-- Javascript inserts weather info here-->
            <div class="border rounded p-3">
                <p id="weather">Loading weather</p>
            </div>

            <!-- Link to give credit to Open-Meteo and bring you to their page on a new tab-->
            <p>
                Weather data
                <a href="https://open-meteo.com/" target="_blank">
                    Open-Meteo
                </a>
            </p>
        </section>

        <!-- Dashboard to display the number of tasks in each status-->
        <section class="mb-4">
            <h2>Task Dashboard</h2>

            <!-- Task totals are updated dynamically with javascript-->
            <p>Total Tasks: <span id="totalTasks">0</span></p>
            <p>To Do: <span id="todoTasks">0</span></p>
            <p>In Progress: <span id="inProgressTasks">0</span></p>
            <p>Completed: <span id="completedTasks">0</span></p>
        </section>
    
        <!-- Section containing a chart with the task information-->
        <section class="mb-4">
            <h2>Task Analytics</h2>

            <!-- Canvas element where chart.js displays a task chart-->
            <canvas id="taskChart"></canvas>
        </section>

        <!-- Section to display the latest activity on the webpage-->
        <section class="mb-4">
            <h2>Latest Activity</h2>

            <!-- Javascript will update this list with the recent activity-->
            <ul id="activityList">
                <li>No recent activity yet.</li>
            </ul>
        </section>

    </main>

    <!-- Placeholder for shared footer-->
    <div id="footer"></div>

</body>
</html>
